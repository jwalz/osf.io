version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: yarn_dependencies
  ignore:
  - dependency-name: webpack
    versions:
    - 5.31.0
    - 5.31.2
    - 5.32.0
    - 5.33.2
    - 5.34.0
    - 5.35.0
    - 5.35.1
    - 5.36.0
  - dependency-name: css-loader
    versions:
    - 5.2.1
    - 5.2.4
  - dependency-name: markdown-it
    versions:
    - 12.0.5
    - 12.0.6
  - dependency-name: faker
    versions:
    - 5.5.3
  - dependency-name: karma-sauce-launcher
    versions:
    - 4.3.6
  - dependency-name: sinon
    versions:
    - 10.0.1
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: yarn_dependencies
  ignore:
  - dependency-name: django-extensions
    versions:
    - 3.1.2
  - dependency-name: furl
    versions:
    - 2.1.0
